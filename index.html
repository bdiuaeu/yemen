<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية الأمن السيبراني | التسجيل وبدء المسار</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="container">
            <div class="logo">CyberAcademy</div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">الرئيسية</a></li>
                <li><a href="curriculum.html">المنهج الشامل</a></li>
                <li><a href="labs.html">التطبيقات والاختبارات</a></li>
            </ul>
        </nav>
    </header>

    <main class="hero container">
        <div class="hero-content" style="max-width: 600px; margin: auto; background: #111827; padding: 2.5rem; border-radius: 0.75rem; border: 1px solid #1f2937;">
            <h1>بوابتك لاحتراف الأمن السيبراني</h1>
            <p>سجل بياناتك أدناه للانضمام إلى المنصة وبدء تتبع مسارك التعليمي واختباراتك العملية.</p>
            
            <!-- نموذج Formspree المخصص لبياناتك -->
            <form action="https://formspree.io/f/xrpzbewr" method="POST" style="display: flex; flex-direction: column; gap: 1rem; text-align: right;">
                <div>
                    <label style="display: block; margin-bottom: 0.5rem; color: #94a3b8;">الاسم الكامل:</label>
                    <input type="text" name="userName" required placeholder="أدخل اسمك الكريم" style="width: 100%; padding: 0.75rem; border-radius: 0.375rem; background: #0b0f19; border: 1px solid #334155; color: #fff;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 0.5rem; color: #94a3b8;">رقم الهاتف:</label>
                    <input type="tel" name="userPhone" required placeholder="أدخل رقم هاتفك مع الرمز الدولي" style="width: 100%; padding: 0.75rem; border-radius: 0.375rem; background: #0b0f19; border: 1px solid #334155; color: #fff;">
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 1rem; border: none; cursor: pointer; font-size: 1rem;">بدء الكورس الآن</button>
            </form>
        </div>
    </main>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 - أكاديمية الأمن السيبراني</p>
    </footer>
</body>
</html>
